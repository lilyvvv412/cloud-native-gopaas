global:
  scrape_interval: 10s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9190"]
  - job_name: resource-service
    static_configs:
      - targets: ["resource-service:9191"]
  - job_name: scheduler-service
    static_configs:
      - targets: ["scheduler-service:9193"]
