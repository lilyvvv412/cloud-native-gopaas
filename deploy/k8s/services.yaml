apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
  namespace: gopaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-service
  template:
    metadata:
      labels:
        app: resource-service
    spec:
      serviceAccountName: gopaas-controller
      containers:
        - name: resource-service
          image: gopaas/resource-service:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gopaas-config
          env:
            - name: SERVICE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SERVICE_PORT
              value: "8081"
            - name: METRICS_PORT
              value: "9191"
            - name: HYSTRIX_PORT
              value: "9091"
          ports:
            - containerPort: 8081
            - containerPort: 9191
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: resource-service
  namespace: gopaas
spec:
  selector:
    app: resource-service
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
    - name: metrics
      port: 9191
      targetPort: 9191
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-service
  namespace: gopaas
spec:
  replicas: 1
  selector:
