apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scheduledtasks.gopaas.io
spec:
  group: gopaas.io
  names:
    kind: ScheduledTask
    listKind: ScheduledTaskList
    plural: scheduledtasks
    singular: scheduledtask
    shortNames:
      - stask
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, schedule]
              properties:
                image:
                  type: string
                schedule:
                  type: string
                command:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                activeJob:
                  type: string
                lastScheduleTime:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Phase
          type: string
          jsonPath: .status.phase
